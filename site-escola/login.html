<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Administrativo - E.E.F. Melvin Jones</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/login.js" defer></script>
</head>

<body class="fundo-login">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="img/logo.png" alt="Logo da Escola" class="logo-imagem">
        <h2>Acesso Administrativo</h2>
        <p>E.E.F. Melvin Jones</p>
      </div>

      <form id="form-login" class="login-form">
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="admin@escola.com" required>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required>
        </div>

        <div id="login-erro" class="mensagem-erro" style="display: none;"></div>

        <button type="submit" class="btn-entrar" id="btn-entrar">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Entrar
        </button>
      </form>
      <div class="login-voltar">
        <a href="index.html">Voltar ao site</a>
      </div>
    </div>
  </div>
</body>

</html>
